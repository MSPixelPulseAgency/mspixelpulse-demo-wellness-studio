<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link
      rel="preload"
      as="font"
      href="/fonts/noire-display.woff2"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      href="/fonts/sans.woff2"
      type="font/woff2"
      crossorigin
    />

    <link
      rel="preload"
      as="font"
      href="/fonts/noire-italic.woff2"
      type="font/woff2"
      crossorigin
    />
    <script>
      (() => {
        const path = location.pathname;
        const name =
          path === "/"
            ? "home"
            : path.startsWith("/services/")
              ? path.split("/")[2]
              : path.split("/")[1];
        const known = [
          "hot-stone-massage",
          "relaxation-massage",
          "aromatherapy-massage",
          "foot-relaxation",
          "couples-massage",
          "evening-reset",
          "botanical-facial",
          "signature-experience",
          "hydrating-facial",
          "deep-cleansing-facial",
          "brightening-facial",
          "sensitive-skin-facial",
          "body-care",
          "body-wrap",
          "body-polish",
          "exfoliation-ritual",
          "hydrating-body",
          "rose-body-ritual",
          "aromatherapy-ritual",
          "guided-relaxation",
          "meditation-session",
          "sound-bath",
          "wellness-consultation",
          "mindfulness-session",
          "couples-spa-escape",
          "bridal-wellness",
          "luxury-spa-day",
          "birthday-spa",
          "signature-indulgence",
          "ultimate-relaxation",
          "pedicure",
          "manicure",
          "luxury-foot-treatment",
          "scalp-massage",
          "hair-spa",
          "services",
          "about",
          "experience",
          "studio",
          "gallery",
          "booking",
          "contact",
          "luxury-hand-treatment",
          "reviews",
          "feedback",
          "wellness-tips",
          "home",
          "faq",
        ];
        if (!known.includes(name)) return;
        const posterWidths = {"botanical-facial":540,"signature-experience":540,"hydrating-facial":540,"brightening-facial":540,"sensitive-skin-facial":540,"body-wrap":540,"exfoliation-ritual":506,"aromatherapy-ritual":506,"guided-relaxation":540,"mindfulness-session":540,"couples-spa-escape":540,"luxury-spa-day":540,"ultimate-relaxation":540,"services":540,"about":506,"gallery":506,"booking":506,"contact":506,"wellness-tips":540,"home":540,"home-atmosphere":540,"faq":540};
        const link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.href = "/videos/v4/" + name + "-960.webp";
        link.imageSrcset = [480, 960]
          .map((w) => "/videos/v4/" + name + "-" + w + ".webp " + (w === 960 ? posterWidths[name] || 960 : w) + "w")
          .join(", ");
        link.imageSizes = "(max-width:760px) 92vw, 48vw";
        link.fetchPriority = "high";
        document.head.append(link);
      })();
    </script>
    <meta name="theme-color" content="#fff7fb" />
    <meta
      name="description"
      content="Explore a fictional Toronto wellness studio: relaxation massage, botanical facials and considered spa rituals. A premium website concept by MSPixelPulse."
    />

    <title>MSPixelPulse Wellness Studio | Your world, on pause</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
